name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build the archive
        run: python3 scripts/package.py --output dist/gomnee.zip --receipt dist/gomnee.receipt.json
